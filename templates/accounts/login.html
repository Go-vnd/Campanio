{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - Companio Skill Exchange</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/accessibility.css' %}">
</head>
<body class="d-flex flex-column min-vh-100 bg-subtle">

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}"><i class="fas fa-hand-holding-heart me-2"></i>Companio</a>
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-link nav-link p-2 theme-toggle-btn"><i class="theme-toggle-icon fas fa-moon fs-5"></i></button>
        <a href="{% url 'register' %}" class="btn btn-outline-custom">Register</a>
      </div>
    </div>
  </nav>

  <main id="main-content" class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card card-custom p-4 p-md-5">
            <div class="text-center mb-4">
              <div class="bg-primary text-white rounded-circle p-3 d-inline-block mb-3"><i class="fas fa-user-lock fs-3"></i></div>
              <h1 class="h3 fw-bold">Welcome Back</h1>
              <p class="text-muted small">Sign in to your Companio account to manage requests or volunteer skills.</p>
            </div>

            <form id="loginForm" method="post" action="{% url 'login' %}">{% csrf_token %}

              <div class="mb-3">
                <label for="loginEmail" class="form-label fw-semibold">Username or Email <span class="text-danger">*</span></label>
                <input type="text" class="form-control form-control-lg" name="username" id="loginEmail" placeholder="Enter username" required>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label for="loginPassword" class="form-label fw-semibold mb-0">Password <span class="text-danger">*</span></label>
                </div>
                <input type="password" class="form-control form-control-lg" name="password" id="loginPassword" placeholder="••••••••" required>
              </div>

              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                <label class="form-check-label text-muted small" for="rememberMe">Remember this browser</label>
              </div>

              <button type="submit" class="btn btn-primary-custom btn-lg w-100 mb-3">Sign In <i class="fas fa-sign-in-alt ms-2"></i></button>

              <div class="text-center text-muted small">
                Don't have an account? <a href="{% url 'register' %}" class="fw-bold text-primary text-decoration-none">Register here</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="accessibility-bar">
    <button id="btn-font-increase">A+</button>
    <button id="btn-font-reset">A</button>
    <button id="btn-font-decrease">A-</button>
    <button id="btn-contrast-toggle"><i class="fas fa-adjust"></i></button>
    <button id="btn-tts-toggle"><i class="fas fa-volume-up"></i></button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
